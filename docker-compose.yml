version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: orchestrator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: claude
      POSTGRES_PASSWORD: claude
      POSTGRES_DB: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claude -d orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orchestrator-net

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: orchestrator-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orchestrator-net

  # ---------------------------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    container_name: orchestrator-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://claude:claude@postgres:5432/orchestrator
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: info
      CORS_ORIGINS: http://localhost:5173
      AUTH_BYPASS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./backend:/app
    networks:
      - orchestrator-net

  # ---------------------------------------------------------------------------
  # Frontend (Vite / React)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    container_name: orchestrator-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - orchestrator-net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  redis_data:

# =============================================================================
# Networks
# =============================================================================
networks:
  orchestrator-net:
    driver: bridge
